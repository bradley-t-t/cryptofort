name: Publish package

# Both registries get every release. npm carries the canonical unscoped name and
# publishes through trusted publishing: no token is stored, npm trades this job's
# OIDC identity for a one-time credential, and it signs provenance as it goes.
# That needs this repository and publish.yml registered as the package's trusted
# publisher on npmjs.com. GitHub Packages only accepts owner-scoped names and
# authenticates with the built-in GITHUB_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish

  github-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      # GitHub Packages requires the owner scope, so publish under the scoped name.
      - run: npm pkg set name=@bradley-t-t/cryptofort
      - run: npm pkg delete publishConfig.registry
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
