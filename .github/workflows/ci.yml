name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
          cache: npm
      - name: Version moved on
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' && hashFiles('package.json') != '' }}
        shell: bash
        run: |
          git fetch --quiet origin "$GITHUB_BASE_REF"
          base=$(git show "origin/$GITHUB_BASE_REF:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version||"")}catch{console.log("")}})')
          head=$(node -e 'console.log(require("./package.json").version||"")')
          node -e '
            const [b, h] = process.argv.slice(1);
            const parts = v => v.split(/[.+-]/).filter(Boolean).map(x => /^\d+$/.test(x) ? Number(x) : x);
            const cmp = (a, c) => { for (let i = 0; i < Math.max(a.length, c.length); i++) { const x = a[i] ?? 0, y = c[i] ?? 0; if (x === y) continue; return (typeof x === "number" && typeof y === "number") ? (x > y ? 1 : -1) : (String(x) > String(y) ? 1 : -1); } return 0; };
            if (!h || (b && cmp(parts(h), parts(b)) <= 0)) { console.error(`Version must move on for every PR into develop: develop has ${b || "none"}, this PR has ${h || "none"}. Run: npm version patch --no-git-tag-version`); process.exit(1); }
            console.log(`version ${b || "none"} -> ${h}`);
          ' "$base" "$head"
          if [ -f public/release.json ]; then
            rel=$(node -e 'console.log(require("./public/release.json").version||"")')
            if [ "$rel" != "$head" ]; then
              echo "public/release.json says $rel but package.json says $head; move the version with the project's own tool (bump-version.py) so release metadata keeps up."
              exit 1
            fi
          fi
          if [ -f README.md ]; then
            badge=$(grep -o 'version-[0-9][0-9A-Za-z.+-]*-' README.md | head -1 | sed 's/^version-//; s/-$//' || true)
            if [ -n "$badge" ] && [ "$badge" != "$head" ]; then
              echo "README version badge says $badge but package.json says $head; move the badge with the version (version-badge.py does it)."
              exit 1
            fi
          fi
      - name: Install and check
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json — nothing to check."
            exit 0
          fi
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present
